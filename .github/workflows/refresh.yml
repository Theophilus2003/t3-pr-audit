name: Refresh audit

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-audit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Audit every open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 audit/run.py --work "$RUNNER_TEMP/t3code" --out .

      - name: Render the preview card
        continue-on-error: true
        run: |
          cp audit/og.mjs "$RUNNER_TEMP/og.mjs"
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node og.mjs "$GITHUB_WORKSPACE/index.html" "$GITHUB_WORKSPACE/og.png"

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html og.png history.json
          git commit -m "Refresh audit" || exit 0
          git push
          # Ask Pages to rebuild in case a push from this token does not start one.
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
